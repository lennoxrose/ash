name: Bug report
description: Something behaves wrongly, crashes, or produces different output on ashvm and kiln
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ashvm --version` (and `kiln --version` if kiln is involved), or the commit
      placeholder: ashvm beta-v0.1.0
    validations: {required: true}
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04, x86_64
    validations: {required: true}
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options: [ashvm, kiln, apm, "ashvm and kiln differ", other]
    validations: {required: true}
  - type: textarea
    id: program
    attributes:
      label: Minimal program
      description: The smallest `.ash` program that shows it, and the command you ran
      render: java
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual output
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Checked
      options:
        - label: It also happens with `memory-safety: off` / it does not (say which in the description)
        - label: I searched existing issues
          required: true
